<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Casse-Briques — ZedJeux</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧱</text></svg>">
<link rel="stylesheet" href="../assets/game.css">
<style>canvas{background:#0b1026;box-shadow:0 12px 32px rgba(0,0,0,.5);cursor:none}</style>
</head>
<body>
<div class="topbar">
  <a class="back-btn" href="../index.html">← Tous les jeux</a>
  <h1>🧱 Casse-Briques</h1><div class="spacer"></div>
</div>
<div class="panel">
  <div class="hud">
    <div class="stat"><small>Score</small><span id="score">0</span></div>
    <div class="stat"><small>Vies</small><span id="lives">❤️❤️❤️</span></div>
    <div class="stat"><small>Niveau</small><span id="level">1</span></div>
    <button class="btn" id="startBtn">▶ Jouer</button>
  </div>
  <canvas class="game" id="cv" width="520" height="420"></canvas>
  <div class="msg" id="msg">Bouge la souris (ou ton doigt) pour déplacer la raquette !</div>
  <p class="hint">🖱️ Souris / tactile / flèches ← → pour bouger · ESPACE pour lancer la balle.<br>Détruis toutes les briques pour passer au niveau suivant (la balle accélère !).</p>
</div>
<script>
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
const W=cv.width,H=cv.height;
const ROWS=6,COLS=9,BW=52,BH=20,GAP=4,OX=(W-COLS*(BW+GAP)+GAP)/2,OY=46;
const COLORS=['#ef4444','#f97316','#eab308','#22c55e','#06b6d4','#a855f7'];
let paddle,balls,bricks,score,lives,level,state='idle',keys={};

function buildBricks(){
  bricks=[];
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++)
    bricks.push({x:OX+c*(BW+GAP),y:OY+r*(BH+GAP),alive:true,color:COLORS[r%COLORS.length],hp:level>=3&&r<2?2:1});
}
function newBall(stuck=true){
  const sp=3.2+level*0.45,ang=(-60-Math.random()*60)*Math.PI/180;
  return{x:paddle.x+paddle.w/2,y:paddle.y-9,vx:sp*Math.cos(ang),vy:sp*Math.sin(ang),r:8,stuck};
}
function reset(full){
  paddle={x:W/2-45,y:H-24,w:90,h:13};
  balls=[newBall()];
  if(full){score=0;lives=3;level=1;}
  buildBricks();updateHud();
}
function updateHud(){
  document.getElementById('score').textContent=score;
  document.getElementById('lives').textContent='❤️'.repeat(Math.max(0,lives))||'—';
  document.getElementById('level').textContent=level;
}
function launch(){balls.forEach(b=>b.stuck=false);if(state==='idle')state='play';}
function draw(){
  ctx.fillStyle='#0b1026';ctx.fillRect(0,0,W,H);
  ctx.fillStyle='rgba(255,255,255,.5)';
  for(let i=0;i<50;i++){ctx.fillRect((i*97)%W,(i*57)%H,1.6,1.6);}
  bricks.forEach(b=>{
    if(!b.alive)return;
    ctx.fillStyle=b.hp===2?'#e2e8f0':b.color;
    ctx.beginPath();ctx.roundRect(b.x,b.y,BW,BH,5);ctx.fill();
    ctx.fillStyle='rgba(255,255,255,.25)';ctx.fillRect(b.x+3,b.y+3,BW-6,5);
  });
  const g=ctx.createLinearGradient(paddle.x,0,paddle.x+paddle.w,0);
  g.addColorStop(0,'#6366f1');g.addColorStop(1,'#a855f7');
  ctx.fillStyle=g;ctx.beginPath();ctx.roundRect(paddle.x,paddle.y,paddle.w,paddle.h,7);ctx.fill();
  balls.forEach(b=>{
    const bg=ctx.createRadialGradient(b.x-3,b.y-3,1,b.x,b.y,b.r);
    bg.addColorStop(0,'#fff');bg.addColorStop(1,'#fbbf24');
    ctx.fillStyle=bg;ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,7);ctx.fill();
  });
  if(state==='idle'||balls.every(b=>b.stuck)&&state==='play'){
    ctx.fillStyle='rgba(255,255,255,.85)';ctx.font='700 17px sans-serif';ctx.textAlign='center';
    ctx.fillText('Clique ou ESPACE pour lancer la balle !',W/2,H-70);
  }
  if(state==='over'){
    ctx.fillStyle='rgba(0,0,0,.6)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#fff';ctx.font='900 38px sans-serif';ctx.textAlign='center';
    ctx.fillText('GAME OVER',W/2,H/2-10);
    ctx.font='700 19px sans-serif';ctx.fillText('Score final : '+score,W/2,H/2+26);
  }
}
function loop(){
  if(keys.left)paddle.x-=7;
  if(keys.right)paddle.x+=7;
  paddle.x=Math.max(0,Math.min(W-paddle.w,paddle.x));
  if(state==='play'){
    balls.forEach(b=>{
      if(b.stuck){b.x=paddle.x+paddle.w/2;b.y=paddle.y-9;return;}
      b.x+=b.vx;b.y+=b.vy;
      if(b.x<b.r){b.x=b.r;b.vx*=-1;}
      if(b.x>W-b.r){b.x=W-b.r;b.vx*=-1;}
      if(b.y<b.r){b.y=b.r;b.vy*=-1;}
      // raquette
      if(b.vy>0&&b.y+b.r>=paddle.y&&b.y-b.r<=paddle.y+paddle.h&&b.x>=paddle.x-b.r&&b.x<=paddle.x+paddle.w+b.r){
        const rel=(b.x-(paddle.x+paddle.w/2))/(paddle.w/2);
        const sp=Math.hypot(b.vx,b.vy),ang=rel*1.1;
        b.vx=sp*Math.sin(ang);b.vy=-sp*Math.cos(ang);b.y=paddle.y-b.r;
      }
      // briques
      for(const br of bricks){
        if(!br.alive)continue;
        if(b.x+b.r>br.x&&b.x-b.r<br.x+BW&&b.y+b.r>br.y&&b.y-b.r<br.y+BH){
          br.hp--;if(br.hp<=0){br.alive=false;score+=10;}else score+=5;
          const overlapL=(b.x+b.r)-br.x,overlapR=(br.x+BW)-(b.x-b.r),overlapT=(b.y+b.r)-br.y,overlapB=(br.y+BH)-(b.y-b.r);
          const m=Math.min(overlapL,overlapR,overlapT,overlapB);
          if(m===overlapL||m===overlapR)b.vx*=-1;else b.vy*=-1;
          updateHud();break;
        }
      }
    });
    balls=balls.filter(b=>b.y-b.r<=H+20);
    if(!balls.length){
      lives--;updateHud();
      if(lives<0){state='over';document.getElementById('msg').textContent=`😵 Partie terminée ! Score : ${score}`;document.getElementById('startBtn').textContent='↻ Rejouer';}
      else{balls=[newBall()];document.getElementById('msg').textContent=`💔 Balle perdue ! Plus que ${lives+1} vie(s). Relance la balle !`;}
    }
    if(bricks.every(b=>!b.alive)){
      level++;buildBricks();balls=[newBall()];updateHud();
      document.getElementById('msg').textContent=`🎉 Niveau ${level} ! Ça va plus vite…`;
    }
  }
  draw();
  requestAnimationFrame(loop);
}
cv.addEventListener('mousemove',e=>{
  const r=cv.getBoundingClientRect();
  paddle.x=(e.clientX-r.left)*(W/r.width)-paddle.w/2;
});
cv.addEventListener('pointerdown',e=>{
  const r=cv.getBoundingClientRect();
  paddle.x=(e.clientX-r.left)*(W/r.width)-paddle.w/2;
  if(state==='play')launch(); else if(state==='idle'){state='play';launch();}
});
cv.addEventListener('pointermove',e=>{
  if(e.pointerType==='touch'){const r=cv.getBoundingClientRect();paddle.x=(e.clientX-r.left)*(W/r.width)-paddle.w/2;}
});
addEventListener('keydown',e=>{
  if(e.key==='ArrowLeft'){keys.left=true;e.preventDefault();}
  if(e.key==='ArrowRight'){keys.right=true;e.preventDefault();}
  if(e.code==='Space'){e.preventDefault();if(state==='over'){reset(true);state='play';launch();}else{state='play';launch();}}
});
addEventListener('keyup',e=>{if(e.key==='ArrowLeft')keys.left=false;if(e.key==='ArrowRight')keys.right=false;});
document.getElementById('startBtn').onclick=function(){
  reset(true);state='play';launch();
  this.textContent='↻ Recommencer';
  document.getElementById('msg').textContent='Casse tout ! 🧱💥';
};
reset(true);loop();
</script>
</body>
</html>
