<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Memory — ZedJeux</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🃏</text></svg>">
<link rel="stylesheet" href="../assets/game.css">
<style>
  #grid{display:grid;gap:10px;width:min(520px,94vw)}
  .card{aspect-ratio:1;perspective:600px;cursor:pointer;background:none;border:none;padding:0}
  .inner{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .45s cubic-bezier(.4,1.6,.6,1)}
  .card.flip .inner{transform:rotateY(180deg)}
  .face{position:absolute;inset:0;border-radius:14px;display:flex;align-items:center;justify-content:center;
    backface-visibility:hidden;-webkit-backface-visibility:hidden;font-size:clamp(28px,7vw,44px)}
  .front{background:linear-gradient(140deg,#6366f1,#a855f7);color:#fff;font-weight:900;box-shadow:0 6px 16px rgba(0,0,0,.35)}
  .front::after{content:'❓';font-size:clamp(20px,5vw,32px)}
  .back{background:#fff;transform:rotateY(180deg);box-shadow:0 6px 16px rgba(0,0,0,.3)}
  .card.matched{cursor:default}
  .card.matched .back{background:#bbf7d0;animation:matchPulse .5s ease}
  @keyframes matchPulse{0%{transform:rotateY(180deg) scale(1)}50%{transform:rotateY(180deg) scale(1.15)}100%{transform:rotateY(180deg) scale(1)}}
</style>
</head>
<body>
<div class="topbar">
  <a class="back-btn" href="../index.html">← Tous les jeux</a>
  <h1>🃏 Memory</h1><div class="spacer"></div>
</div>
<div class="panel">
  <div class="hud">
    <div class="stat"><small>⏱ Temps</small><span id="time">0:00</span></div>
    <div class="stat"><small>👆 Coups</small><span id="moves">0</span></div>
    <div class="stat"><small>✅ Paires</small><span id="pairs">0/8</span></div>
    <select class="sel" id="diff">
      <option value="6">😊 Facile · 6 paires</option>
      <option value="8" selected>😎 Normal · 8 paires</option>
      <option value="12">😈 Difficile · 12 paires</option>
    </select>
    <button class="btn" id="newBtn">↻ Nouvelle partie</button>
  </div>
  <div id="grid"></div>
  <div class="msg" id="msg">Retourne deux cartes et retrouve les paires !</div>
  <p class="hint">Astuce : essaie de mémoriser la position des cartes que tu découvres. 🧠</p>
</div>
<script>
const EMOJIS=['🐶','🐱','🦊','🐼','🦁','🐸','🐵','🦄','🐙','🦋','🍕','🚀','⚽','🎸','🌈','🍩'];
let first=null,lock=false,moves=0,found=0,total=8,seconds=0,timer=null,started=false;
const grid=document.getElementById('grid');

function fmt(s){return Math.floor(s/60)+':'+String(s%60).padStart(2,'0');}
function newGame(){
  total=+document.getElementById('diff').value;
  moves=0;found=0;seconds=0;first=null;lock=false;started=false;
  clearInterval(timer);
  document.getElementById('time').textContent='0:00';
  document.getElementById('moves').textContent=0;
  document.getElementById('pairs').textContent='0/'+total;
  document.getElementById('msg').textContent='Retourne deux cartes et retrouve les paires !';
  const chosen=[...EMOJIS].sort(()=>Math.random()-.5).slice(0,total);
  const deck=[...chosen,...chosen].sort(()=>Math.random()-.5);
  grid.style.gridTemplateColumns=`repeat(${total===6?4:total===8?4:6},1fr)`;
  grid.innerHTML='';
  deck.forEach(e=>{
    const b=document.createElement('button');
    b.className='card';b.dataset.emoji=e;
    b.innerHTML=`<div class="inner"><div class="face front"></div><div class="face back">${e}</div></div>`;
    b.onclick=()=>flip(b);
    grid.appendChild(b);
  });
}
function flip(card){
  if(lock||card.classList.contains('flip'))return;
  if(!started){started=true;timer=setInterval(()=>{seconds++;document.getElementById('time').textContent=fmt(seconds);},1000);}
  card.classList.add('flip');
  if(!first){first=card;return;}
  moves++;document.getElementById('moves').textContent=moves;
  if(first.dataset.emoji===card.dataset.emoji){
    first.classList.add('matched');card.classList.add('matched');
    first=null;found++;
    document.getElementById('pairs').textContent=found+'/'+total;
    if(found===total){
      clearInterval(timer);
      const stars=moves<=total*1.6?'⭐⭐⭐':moves<=total*2.4?'⭐⭐':'⭐';
      document.getElementById('msg').textContent=`🏆 BRAVO ! Terminé en ${fmt(seconds)} et ${moves} coups ! ${stars}`;
    }else document.getElementById('msg').textContent='✅ Paire trouvée ! Continue !';
  }else{
    lock=true;const a=first;first=null;
    document.getElementById('msg').textContent='❌ Raté… retiens bien ces cartes !';
    setTimeout(()=>{a.classList.remove('flip');card.classList.remove('flip');lock=false;},800);
  }
}
document.getElementById('newBtn').onclick=newGame;
document.getElementById('diff').onchange=newGame;
newGame();
</script>
</body>
</html>
