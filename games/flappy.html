<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flappy Oiseau — ZedJeux</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐤</text></svg>">
<link rel="stylesheet" href="../assets/game.css">
<style>canvas{box-shadow:0 12px 32px rgba(0,0,0,.45);cursor:pointer}</style>
</head>
<body>
<div class="topbar">
  <a class="back-btn" href="../index.html">← Tous les jeux</a>
  <h1>🐤 Flappy Oiseau</h1><div class="spacer"></div>
</div>
<div class="panel">
  <div class="hud">
    <div class="stat"><small>Score</small><span id="score">0</span></div>
    <div class="stat"><small>Record</small><span id="best">0</span></div>
    <button class="btn" id="startBtn">▶ Jouer</button>
  </div>
  <canvas class="game" id="cv" width="400" height="540"></canvas>
  <div class="msg" id="msg">Clique, touche l'écran ou appuie sur ESPACE pour voler !</div>
  <p class="hint">Passe entre les tuyaux verts sans les toucher. Chaque tuyau passé = 1 point. Bonne chance ! 🍀</p>
</div>
<script>
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
const W=cv.width,H=cv.height;
let bird,pipes,score,frame,state='idle'; // idle | play | dead
let best=+localStorage.getItem('flappy-best')||0;
document.getElementById('best').textContent=best;
let clouds=Array.from({length:6},()=>({x:Math.random()*W,y:20+Math.random()*160,s:.4+Math.random()*.7,r:16+Math.random()*22}));

function reset(){bird={x:80,y:H/2,v:0,r:17};pipes=[];score=0;frame=0;document.getElementById('score').textContent=0;}
function flap(){
  if(state==='idle'){state='play';document.getElementById('msg').textContent='Vole, petit oiseau ! 🐤';document.getElementById('startBtn').textContent='↻ Recommencer';}
  if(state==='play')bird.v=-8.2;
}
function die(){
  state='dead';
  if(score>best){best=score;localStorage.setItem('flappy-best',best);document.getElementById('best').textContent=best;}
  document.getElementById('msg').textContent=`💥 Aïe ! Score : ${score}${score>=best&&score>0?' — nouveau record ! 🏆':''} Clique sur Recommencer.`;
}
function draw(){
  const sky=ctx.createLinearGradient(0,0,0,H);
  sky.addColorStop(0,'#4fc3f7');sky.addColorStop(.75,'#a5e8ff');sky.addColorStop(1,'#d9f7c4');
  ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);
  // nuages
  ctx.fillStyle='rgba(255,255,255,.9)';
  clouds.forEach(c=>{ctx.beginPath();ctx.arc(c.x,c.y,c.r,0,7);ctx.arc(c.x+c.r*.8,c.y+5,c.r*.7,0,7);ctx.arc(c.x-c.r*.8,c.y+5,c.r*.65,0,7);ctx.fill();});
  // tuyaux
  pipes.forEach(p=>{
    const gap=150;
    const g=ctx.createLinearGradient(p.x,0,p.x+64,0);
    g.addColorStop(0,'#4caf50');g.addColorStop(.5,'#8ee88f');g.addColorStop(1,'#2e7d32');
    ctx.fillStyle=g;ctx.strokeStyle='#1b5e20';ctx.lineWidth=2;
    ctx.fillRect(p.x,0,64,p.top);ctx.strokeRect(p.x,-2,64,p.top+2);
    ctx.fillRect(p.x-4,p.top-26,72,26);ctx.strokeRect(p.x-4,p.top-26,72,26);
    ctx.fillRect(p.x,p.top+gap,64,H);ctx.strokeRect(p.x,p.top+gap,64,H);
    ctx.fillRect(p.x-4,p.top+gap,72,26);ctx.strokeRect(p.x-4,p.top+gap,72,26);
  });
  // sol
  ctx.fillStyle='#ded895';ctx.fillRect(0,H-28,W,28);
  ctx.fillStyle='#7ec850';ctx.fillRect(0,H-28,W,10);
  // oiseau
  ctx.save();ctx.translate(bird.x,bird.y);
  ctx.rotate(Math.max(-.45,Math.min(1.1,bird.v*.07)));
  ctx.font='34px serif';ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText(state==='dead'?'😵':'🐤',0,2);
  ctx.restore();
  // score géant
  ctx.font='900 46px sans-serif';ctx.textAlign='center';
  ctx.lineWidth=6;ctx.strokeStyle='rgba(0,0,0,.55)';ctx.strokeText(score,W/2,70);
  ctx.fillStyle='#fff';ctx.fillText(score,W/2,70);
  if(state==='idle'){
    ctx.fillStyle='rgba(0,0,0,.45)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#fff';ctx.font='900 30px sans-serif';ctx.fillText('FLAPPY OISEAU',W/2,H/2-50);
    ctx.font='600 18px sans-serif';ctx.fillText('Clique ou ESPACE pour voler !',W/2,H/2-10);
    ctx.font='52px serif';ctx.fillText('🐤',W/2,H/2+55);
  }
  if(state==='dead'){
    ctx.fillStyle='rgba(0,0,0,.4)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#fff';ctx.font='900 34px sans-serif';ctx.fillText('GAME OVER',W/2,H/2-20);
    ctx.font='700 20px sans-serif';ctx.fillText('Score : '+score+'  ·  Record : '+best,W/2,H/2+16);
  }
}
function loop(){
  clouds.forEach(c=>{c.x-=c.s;if(c.x<-60){c.x=W+40;c.y=20+Math.random()*160;}});
  if(state==='play'){
    frame++;
    bird.v+=0.45;bird.y+=bird.v;
    if(frame%95===0)pipes.push({x:W+10,top:50+Math.random()*(H-28-150-110),passed:false});
    pipes.forEach(p=>p.x-=2.6);
    pipes=pipes.filter(p=>p.x>-80);
    const gap=150;
    for(const p of pipes){
      if(!p.passed&&p.x+64<bird.x-bird.r){p.passed=true;score++;document.getElementById('score').textContent=score;}
      if(bird.x+bird.r-4>p.x&&bird.x-bird.r+4<p.x+64&&(bird.y-bird.r+4<p.top||bird.y+bird.r-4>p.top+gap))die();
    }
    if(bird.y+bird.r>=H-28||bird.y-bird.r<=0)die();
  }
  draw();
  requestAnimationFrame(loop);
}
document.getElementById('startBtn').onclick=()=>{reset();flap();};
cv.addEventListener('pointerdown',e=>{e.preventDefault();if(state!=='dead')flap();});
addEventListener('keydown',e=>{
  if(e.code==='Space'||e.key==='ArrowUp'){e.preventDefault();state==='dead'?(reset(),flap()):flap();}
});
reset();loop();
</script>
</body>
</html>
