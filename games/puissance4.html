<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Puissance 4 — ZedJeux</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔴</text></svg>">
<link rel="stylesheet" href="../assets/game.css">
<style>
  #board{background:linear-gradient(160deg,#2563eb,#1d4ed8);padding:14px;border-radius:18px;display:grid;grid-template-columns:repeat(7,1fr);gap:9px;width:min(470px,94vw);box-shadow:0 14px 34px rgba(0,0,0,.45)}
  .hole{aspect-ratio:1;border-radius:50%;background:#0b1026;border:none;cursor:pointer;position:relative;box-shadow:inset 0 3px 8px rgba(0,0,0,.7);padding:0}
  .hole .disc{position:absolute;inset:4%;border-radius:50%;transform:scale(0);transition:transform .25s cubic-bezier(.3,1.6,.6,1)}
  .hole.r .disc{background:radial-gradient(circle at 35% 30%,#fca5a5,#dc2626 70%);transform:scale(1)}
  .hole.y .disc{background:radial-gradient(circle at 35% 30%,#fde68a,#eab308 70%);transform:scale(1)}
  .hole.win .disc{box-shadow:0 0 0 4px #fff,0 0 20px #fff;animation:winPulse .45s ease infinite alternate}
  @keyframes winPulse{from{transform:scale(1)}to{transform:scale(1.1)}}
  .hole.hintcol{background:#172554}
</style>
</head>
<body>
<div class="topbar">
  <a class="back-btn" href="../index.html">← Tous les jeux</a>
  <h1>🔴 Puissance 4</h1><div class="spacer"></div>
</div>
<div class="panel">
  <div class="hud">
    <div class="stat"><small>🔴 Rouge</small><span id="sr">0</span></div>
    <div class="stat"><small>🟡 Jaune</small><span id="sy">0</span></div>
    <select class="sel" id="mode">
      <option value="easy">🤖 IA facile</option>
      <option value="hard" selected>🧠 IA forte</option>
      <option value="2p">👥 2 joueurs</option>
    </select>
    <button class="btn" id="newBtn">↻ Recommencer</button>
  </div>
  <div id="board"></div>
  <div class="msg" id="msg">Au tour de 🔴 — clique sur une colonne !</div>
  <p class="hint">Aligne 4 jetons horizontalement, verticalement ou en diagonale. En solo, tu es les 🔴.</p>
</div>
<script>
const ROWS=6,COLS=7;
let board,turn,over,scores={R:0,Y:0},busy=false;
const boardEl=document.getElementById('board'),msg=document.getElementById('msg');

function dropRow(b,c){for(let r=ROWS-1;r>=0;r--)if(!b[r][c])return r;return -1;}
function checkWin(b,r,c,p){
  const dirs=[[0,1],[1,0],[1,1],[1,-1]];
  for(const[dr,dc]of dirs){
    const cells=[[r,c]];
    for(const s of[1,-1]){
      let nr=r+dr*s,nc=c+dc*s;
      while(nr>=0&&nr<ROWS&&nc>=0&&nc<COLS&&b[nr][nc]===p){cells.push([nr,nc]);nr+=dr*s;nc+=dc*s;}
    }
    if(cells.length>=4)return cells;
  }return null;
}
function render(winCells){
  boardEl.innerHTML='';
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
    const b=document.createElement('button');
    const v=board[r][c];
    b.className='hole'+(v==='R'?' r':v==='Y'?' y':'')+(winCells&&winCells.some(([wr,wc])=>wr===r&&wc===c)?' win':'');
    b.innerHTML='<div class="disc"></div>';
    b.onclick=()=>play(c);
    b.onmouseenter=()=>highlight(c,true);
    b.onmouseleave=()=>highlight(c,false);
    boardEl.appendChild(b);
  }
  document.getElementById('sr').textContent=scores.R;
  document.getElementById('sy').textContent=scores.Y;
}
function highlight(c,on){
  boardEl.querySelectorAll('.hole').forEach((el,i)=>{if(i%COLS===c)el.classList.toggle('hintcol',on);});
}
function play(c){
  if(over||busy)return;
  const r=dropRow(board,c);
  if(r<0){msg.textContent='🚫 Colonne pleine ! Choisis-en une autre.';return;}
  board[r][c]=turn;
  const win=checkWin(board,r,c,turn);
  if(win)return end(turn,win);
  if(board[0].every(v=>v))return end(null);
  turn=turn==='R'?'Y':'R';
  render();
  const mode=document.getElementById('mode').value;
  msg.textContent=mode==='2p'?('Au tour de '+(turn==='R'?'🔴':'🟡')):(turn==='Y'?'🤖 L’ordinateur réfléchit…':'À toi de jouer 🔴 !');
  if(mode!=='2p'&&turn==='Y'){busy=true;setTimeout(()=>{busy=false;aiMove(mode);},480);}
}
function scoreBoard(b){
  // évalue pour l'IA (Y) : cherche les fenêtres de 4
  let s=0;
  const val=w=>{
    const y=w.filter(v=>v==='Y').length,r=w.filter(v=>v==='R').length,e=w.filter(v=>!v).length;
    if(y===4)return 10000; if(r===4)return -10000;
    if(y===3&&e===1)return 60; if(y===2&&e===2)return 12;
    if(r===3&&e===1)return -70; if(r===2&&e===2)return -10;
    return 0;
  };
  for(let r=0;r<ROWS;r++)for(let c=0;c<=COLS-4;c++)s+=val([b[r][c],b[r][c+1],b[r][c+2],b[r][c+3]]);
  for(let c=0;c<COLS;c++)for(let r=0;r<=ROWS-4;r++)s+=val([b[r][c],b[r+1][c],b[r+2][c],b[r+3][c]]);
  for(let r=0;r<=ROWS-4;r++)for(let c=0;c<=COLS-4;c++)s+=val([b[r][c],b[r+1][c+1],b[r+2][c+2],b[r+3][c+3]]);
  for(let r=3;r<ROWS;r++)for(let c=0;c<=COLS-4;c++)s+=val([b[r][c],b[r-1][c+1],b[r-2][c+2],b[r-3][c+3]]);
  for(let r=0;r<ROWS;r++)if(b[r][3]==='Y')s+=4; // bonus colonne centrale
  return s;
}
function minimax(b,depth,isMax,alpha,beta){
  if(depth===0)return scoreBoard(b);
  const cols=[3,2,4,1,5,0,6].filter(c=>dropRow(b,c)>=0);
  if(!cols.length)return 0;
  if(isMax){
    let best=-Infinity;
    for(const c of cols){const r=dropRow(b,c);b[r][c]='Y';
      const v=checkWin(b,r,c,'Y')?10000+depth:minimax(b,depth-1,false,alpha,beta);
      b[r][c]='';best=Math.max(best,v);alpha=Math.max(alpha,v);if(beta<=alpha)break;}
    return best;
  }else{
    let best=Infinity;
    for(const c of cols){const r=dropRow(b,c);b[r][c]='R';
      const v=checkWin(b,r,c,'R')?-10000-depth:minimax(b,depth-1,true,alpha,beta);
      b[r][c]='';best=Math.min(best,v);beta=Math.min(beta,v);if(beta<=alpha)break;}
    return best;
  }
}
function aiMove(mode){
  const cols=[0,1,2,3,4,5,6].filter(c=>dropRow(board,c)>=0);
  let choice;
  if(mode==='easy'&&Math.random()<0.5)choice=cols[Math.floor(Math.random()*cols.length)];
  else{
    // victoire immédiate ?
    choice=cols.find(c=>{const r=dropRow(board,c);board[r][c]='Y';const w=!!checkWin(board,r,c,'Y');board[r][c]='';return w;});
    // bloquer le joueur ?
    if(choice===undefined)choice=cols.find(c=>{const r=dropRow(board,c);board[r][c]='R';const w=!!checkWin(board,r,c,'R');board[r][c]='';return w;});
    if(choice===undefined){
      let best=-Infinity;choice=cols[0];
      for(const c of[3,2,4,1,5,0,6]){if(dropRow(board,c)<0)continue;
        const r=dropRow(board,c);board[r][c]='Y';
        const v=minimax(board,mode==='easy'?1:4,false,-Infinity,Infinity);board[r][c]='';
        if(v>best){best=v;choice=c;}}
    }
  }
  play(choice);
}
function end(winnerP,winCells){
  over=true;render(winCells);
  if(winnerP){scores[winnerP]++;render(winCells);}
  msg.textContent=winnerP?`🎉 Les ${winnerP==='R'?'🔴 rouges':'🟡 jaunes'} gagnent !`:'🤝 Grille pleine, match nul !';
}
function newGame(){
  board=Array.from({length:ROWS},()=>Array(COLS).fill(''));
  turn='R';over=false;busy=false;render();
  msg.textContent='Au tour de 🔴 — clique sur une colonne !';
}
document.getElementById('newBtn').onclick=newGame;
document.getElementById('mode').onchange=()=>{scores={R:0,Y:0};newGame();};
newGame();
</script>
</body>
</html>
